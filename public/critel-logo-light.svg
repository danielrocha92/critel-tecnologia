<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" fill="none">
  <defs>
    <linearGradient id="ovalTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d4a6b"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="ovalBot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a566e"/>
      <stop offset="100%" stop-color="#243f58"/>
    </linearGradient>
  </defs>

  <!-- Ícone oval Critel — fiel ao logo oficial adaptado para fundo escuro -->
  <g transform="translate(2, 4)">
    <!-- Arco externo superior -->
    <path d="M24 2 C38 2 49 11 51 24 L44 24 C42.5 15 34.5 9 24 9 C13.5 9 5.5 15 4 24 L-3 24 C-1 11 10 2 24 2 Z"
          fill="#c0c9d4" opacity="0.85"/>
    <!-- Arco externo inferior -->
    <path d="M24 50 C10 50 -1 41 -3 28 L4 28 C5.5 37 13.5 43 24 43 C34.5 43 42.5 37 44 28 L51 28 C49 41 38 50 24 50 Z"
          fill="#c0c9d4" opacity="0.85"/>
    <!-- Meia-lua interna superior -->
    <ellipse cx="24" cy="18" rx="14" ry="9" fill="url(#ovalTop)" opacity="0.9"/>
    <!-- Meia-lua interna inferior -->
    <ellipse cx="24" cy="34" rx="14" ry="9" fill="url(#ovalBot)" opacity="0.9"/>
    <!-- Borda oval externa -->
    <ellipse cx="24" cy="26" rx="20" ry="24" stroke="#2d4a6b" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Tipografia: "Critel" em vermelho carmim -->
  <text x="62" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" letter-spacing="-0.3" fill="#c9253a">Critel</text>
  <!-- Tipografia: " Tecnologia" em branco/cinza claro -->
  <text x="114" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" letter-spacing="-0.2" fill="#e2e8f0">Tecnologia</text>

  <!-- Tagline -->
  <text x="63" y="44" font-family="Inter, system-ui, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.5" fill="#64748b">INFRAESTRUTURA &amp; TI</text>
</svg>
